name: Native build and tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check changed lines for whitespace errors
        shell: bash
        env:
          PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=$PREVIOUS_SHA
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              base=$(git hash-object -w -t tree --stdin </dev/null)
            else
              base=$(git merge-base "refs/remotes/origin/$DEFAULT_BRANCH" HEAD)
            fi
          fi
          git diff --check "$base" HEAD --
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo +stable test --workspace --locked
      - run: cargo +stable build --workspace --locked
      - name: rmem interactive smoke check
        if: runner.os != 'Windows'
        run: python3 .github/scripts/rmem-smoke.py target/debug/rmem
      - name: fsz Windows directory symlink smoke check
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/fsz-windows-symlink-smoke.ps1
      - name: lfd default build smoke check
        if: runner.os == 'macOS'
        run: python3 .github/scripts/lfd-smoke.py target/debug/lfd DefaultBuildTests
      - name: lfd isolated cleanup smoke check
        if: runner.os == 'macOS'
        run: |
          cargo +stable build --locked -p lfd --features test-fixtures
          python3 .github/scripts/lfd-smoke.py target/debug/lfd
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check packaging scripts
        shell: bash
        run: |
          sh -n packaging/install.sh
          node --check packaging/launch.cjs
          node --check packaging/stage.mjs
      - name: Stage and inspect npm packages
        shell: bash
        run: |
          mkdir assets
          for platform in linux-x64 darwin-arm64; do
            for tool in fsz rmem; do
              printf '#!/bin/sh\nexit 0\n' > "assets/$tool-$platform"
            done
          done
          for tool in fsz rmem; do
            printf 'placeholder\n' > "assets/$tool-win32-x64.exe"
          done
          node packaging/stage.mjs 0.0.0 assets npm-packages
          for name in devops-tool-linux-x64 devops-tool-darwin-arm64 devops-tool-win32-x64 fsz rmem devops-tool; do
            npm pack "./npm-packages/$name" --dry-run >/dev/null
          done
