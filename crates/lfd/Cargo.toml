[package]
name = "lfd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "macOS uninstall leftover inspection and selective cleanup"
license = "MIT"

[features]
test-fixtures = []

[target.'cfg(target_os = "macos")'.dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
libc = "0.2.191"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSJSONSerialization", "NSPropertyList", "NSString"] }
